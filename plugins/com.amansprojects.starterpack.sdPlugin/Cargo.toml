[package]
name = "opendeck-starterpack"
authors = ["Aman Khanna (nekename)"]
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
openaction = "2.6"
anyhow = "1.0"
log = "0.4"
simplelog = "0.12"
serde = "1.0"
serde_json = "1.0"
ron = "0.12"
enigo = { git = "https://github.com/enigo-rs/enigo.git", rev = "a88d9b7e2cec7043ab5f03e754500a091ea928d1", features = ["serde", "x11rb", "wayland", "libei", "tokio", "platform_specific"] }
tokio = { version = "1.48", features = ["full"] }
os_pipe = "1.2"
